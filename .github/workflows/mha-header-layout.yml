name: One-time My Healthy Aura header layout patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mha-header-layout.yml'

permissions:
  contents: write

jobs:
  patch-header:
    if: contains(github.event.head_commit.message, 'Install one-time My Healthy Aura header layout patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply centered navigation layout
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}'
          override = '''    /* Portfolio header diversity pass: centered practice identity with split navigation. */
              @media(min-width:981px){
                .nav-wrap{display:grid;grid-template-columns:1fr auto 1fr;position:relative}
                .brand{grid-column:2;grid-row:1;justify-self:center;z-index:2}
                .site-nav{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:auto auto minmax(210px,1fr) auto auto auto;align-items:center;gap:22px;width:100%}
                .site-nav a:nth-child(1){grid-column:1}
                .site-nav a:nth-child(2){grid-column:2}
                .site-nav a:nth-child(3){grid-column:4}
                .site-nav a:nth-child(4){grid-column:5}
                .site-nav a:nth-child(5){grid-column:6}
              }
          '''
          if override.strip() not in text:
              if marker not in text:
                  raise SystemExit('Expected CSS marker not found; refusing to modify index.html')
              text = text.replace(marker, override + marker, 1)
              path.write_text(text, encoding='utf-8')
      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/mha-header-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/mha-header-layout.yml
          git commit -m "Center My Healthy Aura identity and split navigation"
          git push
