name: One-time My Healthy Aura copy cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-copy-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update requested wording
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'Bridge the gap between insight and daily execution.': 'Bridge the gap between intention and daily execution.',
              'Insight matters. What you do with it matters more.': 'Awareness matters. What you do with it matters more.',
              'Structured request': 'Initial assessment',
              'the patterns and constraints uncovered during request': 'the patterns and constraints uncovered during your first conversation',
              'A structured behavioral request and assessment': 'A structured behavioral assessment',
              'Individual session design based on request findings': 'Individual session design based on what we learn',
              'Begin the request process': 'Begin the conversation',
              'The first step is a structured behavioral request—not a generic contact form.': 'The first step is a structured behavioral questionnaire—not a generic contact form.',
              'New My Healthy Aura request Request': 'New My Healthy Aura Request',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          # Guarantee the two unwanted terms do not remain in visible/source copy.
          text = re.sub(r'\binsight\b', 'awareness', text, flags=re.IGNORECASE)
          text = re.sub(r'\bintake\b', 'request', text, flags=re.IGNORECASE)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet -- index.html; then
            echo "No copy changes needed."
            exit 0
          fi
          git config user.name "Joseph Jilovec Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Refine My Healthy Aura wording"
          git push

# One-time utility for this specific copy cleanup.
